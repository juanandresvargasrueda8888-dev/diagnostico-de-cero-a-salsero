<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Por qué te quedas sentado cuando suena la salsa?</title>
<meta name="description" content="5 preguntas sencillas, pensadas para quien nunca ha bailado. Descubre qué te frena y cuál es tu primer paso real.">
<meta property="og:title" content="¿Por qué te quedas sentado cuando suena la salsa?">
<meta property="og:description" content="5 preguntas. 2 minutos. No necesitas saber bailar para responderlas.">
<meta name="theme-color" content="#123B3A">
<meta property="og:type" content="website">
<meta property="og:url" content="https://de-cero-a-salsero.vercel.app/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Colores y tipografía de la marca De Cero a Salsero */
:root {
  --brand-primary: #123B3A;
  --brand-accent: #B94735;
  --brand-background: #F5EFE6;
  --brand-text: #171717;
  --brand-muted: #8A847C;
  --brand-white: #FFFFFF;

  --font-display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --font-body: "Poppins", -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Derivados (no cambiar salvo que quieras otro contraste) */
  --bg: var(--brand-background);
  --surface: var(--brand-white);
  --ink: var(--brand-text);
  --muted: #6F6A63;              /* --brand-muted oscurecido para texto legible */
  --line: #E4DCCF;
  --primary: var(--brand-primary);
  --on-primary: #F5EFE6;
  --accent: var(--brand-accent);
  --accent-soft: #F3E3DC;
  --gutter: 20px;
  --col: 560px;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1F1E; --surface: #142B2A; --ink: #F5EFE6; --muted: #A9B3AF; --line: #24403E;
    --primary: #F5EFE6; --on-primary: #123B3A; --accent: #E0735F; --accent-soft: #2A2420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1F1E; --surface: #142B2A; --ink: #F5EFE6; --muted: #A9B3AF; --line: #24403E;
  --primary: #F5EFE6; --on-primary: #123B3A; --accent: #E0735F; --accent-soft: #2A2420; color-scheme: dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:calc(var(--col) + var(--gutter)*2); margin:0 auto; padding:16px var(--gutter) 56px; min-height:100svh; display:flex; flex-direction:column}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px}

/* Cabecera */
.top{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:6px 0 24px}
.brand{font-family:var(--font-display); font-size:18px; letter-spacing:.04em; text-transform:uppercase; color:var(--primary)}
.brand b{font-weight:400; color:var(--accent)}
.tag{font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

.screen{flex:1; display:flex; flex-direction:column}
.screen[hidden]{display:none!important}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001; transform:translateY(8px)}to{opacity:1; transform:none}}

.eyebrow{font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin:0 0 16px}
.label{font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
h1,h2,h3{margin:0; text-wrap:balance}
.display{font-family:var(--font-display); font-weight:400; text-transform:uppercase; letter-spacing:.005em; color:var(--primary)}
.display em{font-style:normal; color:var(--accent)}

/* Portada */
h1.display{font-size:clamp(40px, 12vw, 70px); line-height:.98}
.lead{color:var(--muted); font-size:16px; margin:18px 0 0; max-width:36ch}
.learn{list-style:none; margin:20px 0 0; padding:0; display:grid; gap:10px; border-top:1px solid var(--line); padding-top:16px}
.learn[hidden]{display:none}
.learn li{display:grid; grid-template-columns:32px 1fr; gap:8px; align-items:baseline; font-size:14.5px; line-height:1.5}
.learn li i{font-style:normal; font-family:var(--font-display); font-size:16px; color:var(--accent)}
.meta{font-size:13px; color:var(--muted); margin:14px 0 0; text-align:center}

/* Botones */
.btn{appearance:none; border:0; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:10px; text-align:center;
  min-height:56px; padding:0 24px; border-radius:999px; font-weight:600; font-size:16px; line-height:1.25; text-decoration:none; transition:transform .15s ease, opacity .15s ease, background .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary); color:var(--on-primary)}
.btn-accent{background:var(--brand-accent); color:#fff}
.btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.35; cursor:default}
.cta-row{margin-top:auto; padding-top:20px}

/* Progreso */
.progress{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px}
.beat{height:4px; border-radius:2px; background:var(--line); transition:background .3s ease}
.beat.done{background:var(--primary)}
.beat.now{background:var(--accent)}
.qmeta{display:flex; justify-content:space-between; font-size:12px; font-weight:500; letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.qmeta b{color:var(--ink); font-weight:600}

/* Pregunta */
.qnum{font-family:var(--font-display); font-size:56px; line-height:1; color:var(--accent); margin:32px 0 10px}
.qtext{font-size:clamp(22px, 6.2vw, 28px); font-weight:600; line-height:1.28; letter-spacing:-.01em; margin:0}
.qhint{color:var(--muted); font-size:14.5px; margin:10px 0 0}
.opts{display:grid; gap:10px; margin-top:24px}
.opt{appearance:none; text-align:left; cursor:pointer; width:100%;
  display:grid; grid-template-columns:22px minmax(0,1fr); gap:14px; align-items:start;
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; font-size:15.5px; line-height:1.45; min-height:60px;
  transition:border-color .15s ease, background .15s ease}
.opt:hover{border-color:var(--muted)}
.opt .dot{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line); margin-top:1px; display:grid; place-items:center; transition:all .15s ease}
.opt[aria-checked="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-checked="true"] .dot{border-color:var(--accent); background:var(--accent)}
.opt[aria-checked="true"] .dot::after{content:""; width:7px; height:7px; border-radius:50%; background:#fff}
.opt-eco{display:block; margin-top:8px; color:var(--accent); font-weight:600; font-size:14px; line-height:1.4}
.opt-eco:empty{display:none}
.opt-eco:not(:empty){animation:fade .35s ease both}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.nav{display:flex; gap:10px; margin-top:auto; padding-top:28px}
.nav .btn{flex:1; min-height:54px; padding:0 16px}
.nav .btn-ghost{flex:0 0 auto; min-width:118px}

/* Analizando */
.thinking{flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; min-height:50svh}
.pulse{display:flex; gap:8px}
.pulse span{width:10px; height:10px; border-radius:50%; background:var(--accent); animation:clave 1.2s infinite ease-in-out}
.pulse span:nth-child(2){animation-delay:.2s}.pulse span:nth-child(3){animation-delay:.4s}
@keyframes clave{0%,100%{opacity:.25; transform:scale(.8)}40%{opacity:1; transform:scale(1)}}

/* Resultado */
.r-stage{font-family:var(--font-display); text-transform:uppercase; font-size:clamp(34px, 10vw, 48px); line-height:1; color:var(--primary)}
.track{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:20px}
.track span{height:6px; border-radius:3px; background:var(--line)}
.track span.on{background:var(--primary)}
.track span.here{background:var(--accent)}
.track-labels{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px}
.stage-text{color:var(--muted); margin:16px 0 0}

.block{border-top:1px solid var(--line); margin-top:40px; padding-top:28px}
.route{font-family:var(--font-display); text-transform:uppercase; font-size:clamp(36px, 11vw, 54px); line-height:.98; color:var(--accent)}
.bottleneck{font-size:clamp(20px, 5.6vw, 24px); font-weight:600; line-height:1.3; margin-top:14px}
.prose{margin:0; max-width:62ch}
.prose + .prose{margin-top:12px}

.hear{margin:28px 0 0; font-size:17px; line-height:1.55; font-weight:500}
.lead-strong{color:var(--ink); font-weight:500}
.lead + .lead{margin-top:12px}

/* Resumen del resultado */
.r-head{font-family:var(--font-display); font-weight:400; text-transform:uppercase; font-size:clamp(32px, 9.6vw, 46px); line-height:1.02; color:var(--primary)}
.r-stage-line{margin:16px 0 0; font-weight:600}
.r-score{color:var(--muted); font-weight:400}
#rTrack{margin-top:12px}
#rPrio{margin-top:12px}
.first .mt{margin:0; font-weight:600; font-size:17px; line-height:1.35}
.first .mc{margin:6px 0 0}
.first .ms{margin:12px 0 0; font-size:14px; color:var(--muted); padding:10px 12px; background:var(--accent-soft); border-radius:10px}
.first .ms b, .moves .ms b{display:block; color:var(--accent); font-weight:600; font-size:11px; letter-spacing:.14em; margin-bottom:2px}
.more{margin-top:24px}
.testi{margin:0}
.testi-frame{position:relative; width:100%; max-width:380px; margin:0 auto; aspect-ratio:4/5; border-radius:18px; overflow:hidden; background:var(--brand-primary)}
.testi video{width:100%; height:100%; object-fit:cover; display:block; background:var(--brand-primary); filter:brightness(1.32) contrast(1.06) saturate(1.06)}   /* un poco más de luz al video */
.testi figcaption{max-width:380px; margin:16px auto 0}
.testi-quote{margin:0; font-size:17px; font-weight:500; line-height:1.45}
.testi-name{margin:12px 0 0; font-weight:600}
.testi-frase{margin:0; font-size:17px; font-weight:600; line-height:1.45; color:var(--primary)}
.testi-quote + .testi-frase{margin-top:12px}
.testi-detail{margin:2px 0 0; font-size:14px; color:var(--muted)}
.juan{display:grid; grid-template-columns:72px minmax(0,1fr); gap:16px; align-items:start}
.juan-photo{width:72px; height:72px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--brand-accent)}
.juan-name{font-family:var(--font-display); font-weight:400; text-transform:uppercase; font-size:26px; line-height:1.05; color:var(--primary); margin-bottom:8px}
.next p b{color:#F5EFE6; font-weight:600}
.next-line{display:block; width:44px; height:3px; border-radius:2px; background:var(--brand-accent); margin-bottom:18px}
.repeat{text-align:center; margin:22px 0 0}
.link-btn{appearance:none; background:none; border:0; cursor:pointer; color:var(--muted); text-decoration:underline; font-size:14px; min-height:44px; padding:0 12px}

/* Ruta completa (desplegable) */
.more > summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
  min-height:52px; padding:0 20px; border:1.5px solid var(--line); border-radius:999px;
  font-weight:600; font-size:14px; letter-spacing:.02em; color:var(--primary); text-align:center}
.more > summary::-webkit-details-marker{display:none}
.more > summary::after{content:"+"; font-size:20px; line-height:1; color:var(--accent)}
.more[open] > summary::after{content:"–"}
.more > summary:hover{border-color:var(--muted)}
.more-body > .block:first-child{margin-top:28px}
.path-note{font-size:14px; color:var(--muted); margin:0 0 16px}

/* Creencia vs. realidad */
.myth{display:grid; gap:18px}
.myth .belief{font-size:19px; font-weight:600; line-height:1.35; color:var(--muted); text-decoration:line-through; text-decoration-color:var(--accent); text-decoration-thickness:2px}
.myth .truth{margin:0; padding-left:16px; border-left:3px solid var(--accent)}

.moves{list-style:none; margin:0; padding:0; display:grid; gap:22px}
.moves li{display:grid; grid-template-columns:44px minmax(0,1fr); gap:4px}
.moves-intro{margin-bottom:22px; font-weight:500}
.moves .mt{margin:0; font-weight:600; font-size:17px; line-height:1.35}
.moves .mc{margin:6px 0 0}
.moves .mp{margin:8px 0 0; font-size:14.5px; color:var(--muted)}
.moves .mp b{color:var(--ink); font-weight:600}
.moves .ms{margin:10px 0 0; font-size:14px; color:var(--muted); padding:10px 12px; background:var(--accent-soft); border-radius:10px}
.moves .num{font-family:var(--font-display); font-size:24px; line-height:1.15; color:var(--accent)}

/* Camino de A a B */
.ab{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:26px}
.ab div{border:1.5px solid var(--line); border-radius:var(--radius); padding:14px}
.ab div:last-child{border-color:var(--primary)}
.ab b{display:block; font-family:var(--font-display); font-weight:400; font-size:22px; line-height:1; color:var(--primary); margin-bottom:8px; text-transform:uppercase}
.ab div:first-child b{color:var(--accent)}
.ab span{font-size:14px; line-height:1.45; display:block}
.path{list-style:none; margin:0; padding:0; display:grid}
.path li{display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; padding-bottom:22px; position:relative}
.path li:not(:last-child)::before{content:""; position:absolute; left:9px; top:20px; bottom:0; width:2px; background:var(--line)}
.path .pt{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); background:var(--bg); margin-top:2px}
.path li.here .pt{border-color:var(--accent); background:var(--accent)}
.path .ph{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.path .ph em{font-style:normal; color:var(--accent); margin-left:6px}
.path .pn{font-weight:600; margin:2px 0}
.path .pd{font-size:14.5px; color:var(--muted)}
.gap{margin:0 0 24px; font-weight:600}
.note{font-size:15px; margin:4px 0 0; padding:16px; background:var(--accent-soft); border-radius:var(--radius)}

.profile{display:grid; gap:14px; margin:0; padding:0; list-style:none}
.profile li{display:grid; grid-template-columns:30px minmax(0,1fr); gap:12px; align-items:center}
.profile .l{font-family:var(--font-display); font-size:24px; line-height:1; color:var(--muted)}
.profile .n{display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:6px}
.profile .n span:last-child{font-size:12px; color:var(--muted); white-space:nowrap}
.profile .bar{height:6px; border-radius:3px; background:var(--line); overflow:hidden}
.profile .bar i{display:block; height:100%; background:var(--primary); border-radius:3px; width:0; transition:width .9s cubic-bezier(.2,.7,.2,1)}
.profile .read{margin:8px 0 0; font-size:14.5px; line-height:1.5}
.profile li{align-items:start}
.profile .l{padding-top:2px}
.profile li.key .l{color:var(--accent)}
.profile li.key .bar i{background:var(--accent)}
.profile li.key .n span:first-child{font-weight:600}

/* Siguiente paso */
.next{background:var(--brand-primary); color:#F5EFE6; border-radius:22px; padding:32px 22px; margin-top:48px}
.next h3{font-family:var(--font-display); font-weight:400; text-transform:uppercase; font-size:clamp(28px, 8vw, 38px); line-height:1.05; color:#F5EFE6; overflow-wrap:break-word}
.btn-cta{background:#F5EFE6; color:var(--brand-primary); font-weight:600; letter-spacing:.02em; min-height:56px; padding:0 14px; margin-top:26px!important}
.btn-cta:hover{background:#FFFFFF}
.next p{margin:14px 0 0; color:rgba(245,239,230,.86)}
.doubts-t{font-weight:600; color:#F5EFE6!important; margin-top:22px!important}
.doubts{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:10px}
.doubts li{display:grid; grid-template-columns:18px minmax(0,1fr); gap:10px; font-size:15px; color:#F5EFE6}
.doubts li::before{content:""; width:8px; height:8px; border-radius:50%; background:#E89A8B; margin-top:9px}
.chips-q{font-size:14px; font-weight:600; margin:28px 0 10px; color:#F5EFE6}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{appearance:none; cursor:pointer; border:1.5px solid rgba(245,239,230,.28); background:transparent; color:#F5EFE6;
  border-radius:999px; padding:10px 16px; min-height:44px; font-size:14px; line-height:1.3; text-align:left}
.chip[aria-pressed="true"]{background:#F5EFE6; color:var(--brand-primary); border-color:#F5EFE6; font-weight:600}
.next .cap{font-size:14px; font-weight:600; color:#F5EFE6; margin:26px 0 0}
.next .btn{margin-top:10px}
.btn-line{background:transparent; color:#F5EFE6; border:1.5px solid rgba(245,239,230,.35)}
.next small{display:block; margin-top:14px; font-size:13px; color:rgba(245,239,230,.7)}
.method{font-size:12px; letter-spacing:.06em; color:rgba(245,239,230,.66); margin-top:22px; border-top:1px solid rgba(245,239,230,.16); padding-top:16px}

.secondary{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px}
.secondary .btn{flex:1 1 200px; min-height:52px; font-size:15px}
.print-only{display:none}

@media (min-width:640px){
  :root{--gutter:32px}
  .wrap{padding-block:32px 72px}
  .next{padding:40px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}

/* Versión limpia para guardar como PDF */
@media print{
  @page{margin:18mm 16mm}
  :root{--bg:#fff; --ink:#111; --muted:#555; --line:#ddd; --primary:#123B3A; --accent:#B94735; --accent-soft:#F6ECE8}
  body{background:#fff; color:#111; font-size:11.5pt}
  .wrap{max-width:none; padding:0; min-height:0}
  .screen:not(#s-result), .no-print{display:none!important}
  .print-only{display:block}
  .more > summary{display:none}
  .more{margin-top:0}
  .fade{animation:none}
  .block{margin-top:20px; padding-top:14px; break-inside:avoid}
  .profile .bar i{transition:none}
  .r-stage{font-size:26pt}
  .route{font-size:30pt}
  .moves li, .path li{break-inside:avoid}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="brand"></div>
  </header>

  <!-- PORTADA -->
  <section class="screen fade" id="s-cover" aria-labelledby="coverTitle">
    <p class="eyebrow" id="coverEyebrow"></p>
    <h1 class="display" id="coverTitle"></h1>
    <p class="lead lead-strong" id="coverIntro"></p>
    <p class="lead" id="coverPromise"></p>
    <ul class="learn" id="coverLearn"></ul>
    <div class="cta-row">
      <button class="btn btn-primary btn-block" id="startBtn" type="button"></button>
      <p class="meta" id="coverMeta"></p>
    </div>
  </section>

  <!-- PREGUNTAS -->
  <section class="screen" id="s-quiz" hidden>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="qmeta"><span>Pregunta <b id="qNum">1</b> de <b id="qTotal">5</b></span><span id="qPct">0%</span></div>
    <div id="qBody" class="fade">
      <div class="qnum" id="qBig" aria-hidden="true">01</div>
      <h2 class="qtext" id="qText"></h2>
      <p class="qhint" id="qHint"></p>
      <div class="opts" id="opts" role="radiogroup" aria-labelledby="qText"></div>
      <p class="sr-only" id="qEco" aria-live="polite"></p>
    </div>
    <div class="nav">
      <button class="btn btn-ghost" id="prevBtn" type="button">Anterior</button>
      <button class="btn btn-primary" id="nextBtn" type="button" disabled>Siguiente</button>
    </div>
  </section>

  <!-- MOTIVO (sin puntaje: personaliza el resultado) -->
  <section class="screen" id="s-motive" hidden>
    <div class="progress full" aria-hidden="true"><span class="beat done"></span><span class="beat done"></span><span class="beat done"></span><span class="beat done"></span><span class="beat now"></span></div>
    <div class="qmeta"><span id="mEyebrow"></span><span>100%</span></div>
    <div class="fade">
      <h2 class="qtext" id="mText" style="margin-top:32px"></h2>
      <p class="qhint" id="mHint"></p>
      <div class="opts" id="mOpts" role="radiogroup" aria-labelledby="mText"></div>
    </div>

  // Preguntas. "tema" es la etiqueta corta del mensaje; "ayuda" es opcional.
  // "eco": reacción breve que aparece al elegir cada respuesta.
  // "lecturas": lo que el resultado le dice sobre cada respuesta (mismo orden que "respuestas").
  preguntas: [
    { area: "R", tema: "En una fiesta",
      texto: "Piensa en la última boda o fiesta a la que fuiste. Empieza una salsa y la pista se llena. ¿Qué hiciste tú?",
      ayuda: "Aquí no hay respuestas buenas ni malas. Si hace tiempo que no vas a una fiesta, imagina qué harías.",
      respuestas: [
        "Me quedé en la mesa: conversando, con el celular o yendo por algo a la barra.",
        "Bailé porque alguien me sacó, pero me quedé en blanco y solo quería que terminara.",
        "Me animé a una canción, pero no supe qué más hacer y no repetí.",
        "Invité yo a alguien y lo disfruté."
      ],
      eco: ["Te entiendo. Es el punto de partida de la mayoría.", "Le pasa a muchos. Las ganas están, y eso es lo importante.", "Levantarte ya fue lo más difícil. Vamos bien.", "Excelente. Esa seguridad vale oro."],
      lecturas: [
        "Hoy prefieres esquivar la pista. Es más común de lo que crees, y tiene solución cuando sabes qué te frena.",
        "Cuando te sacan, te animas: las ganas están. Lo que falta es saber qué hacer una vez que estás ahí.",
        "Ya te atreves a levantarte, y ese es el paso más difícil. Ahora toca que bailar se sienta cómodo y no un esfuerzo.",
        "Te levantas e invitas. La seguridad para dar el primer paso ya la tienes de tu lado."
      ]},
    { area: "S", tema: "Escuchar la música",
      texto: "Suena una salsa. Sin pensarlo mucho, ¿tu cuerpo sabe en qué momento moverse?",
      ayuda: "No importa si nunca has bailado: responde según lo que escuchas.",
      respuestas: [
        "No. Escucho muchos instrumentos a la vez y no sé cuándo dar el paso.",
        "A veces muevo el pie con la música, pero no sé si lo hago bien.",
        "Lo siento al principio, pero si la canción se acelera, me pierdo.",
        "Sí, sigo la música sin problema durante toda la canción."
      ],
      eco: ["Tiene sentido: nadie te enseñó qué escuchar. Eso se aprende.", "Tu cuerpo ya responde a la música. Buena señal.", "Muy común, y tiene un ajuste concreto.", "Gran ventaja: tu oído ya está listo."],
      lecturas: [
        "Todavía no sabes cuándo moverte. Es lo primero que se entrena, y se logra con ejercicios muy simples.",
        "Tu cuerpo ya reacciona a la música. Solo falta confirmar que vas a tiempo.",
        "Encuentras el ritmo; lo que falta es sostenerlo cuando la canción cambia.",
        "Tu oído ya está listo, y eso es una gran ventaja para todo lo demás."
      ]},
    { area: "A", tema: "Qué hacer con los pies",
      texto: "Si ahora mismo alguien te dijera «ven, bailemos», ¿qué harían tus pies?",
      ayuda: "",
      respuestas: [
        "Nada. No sé ni un paso de salsa.",
        "Algo intentaría, pero mirándome los pies y contando en voz baja.",
        "Tengo un paso que me sale, pero si me hablan o me pongo nervioso, se me olvida.",
        "Bailaría tranquilo: el paso me sale sin pensar."
      ],
      eco: ["Perfecto. Así empezó todo el que hoy baila.", "Normal al principio: el paso todavía depende de tu cabeza.", "Ya tienes una base. Falta que aguante los nervios.", "Muy bien. Esa base te va a ayudar mucho."],
      lecturas: [
        "Partes de cero con los pies, y está bien: así empezó todo el que hoy baila.",
        "Tienes una idea del paso, pero todavía depende de mirar y contar.",
        "Ya tienes un paso propio. Falta que aguante aunque te distraigas.",
        "Tu paso sale solo. Esa base te permite avanzar con calma."
      ]},
    { area: "B", tema: "Una canción completa",
      texto: "Una salsa dura más o menos 3 minutos. Si ya estás en la pista, ¿hasta dónde llegas?",
      ayuda: "",
      respuestas: [
        "No llegaría ni a empezar. No sabría qué hacer.",
        "Unos segundos, y luego me quedaría parado sin saber cómo seguir.",
        "Toda la canción, pero repitiendo el mismo movimiento una y otra vez.",
        "Toda la canción, cambiando de movimientos con naturalidad."
      ],
      eco: ["Tranquilo: con pocos movimientos bien unidos, esto cambia.", "Quedarse en blanco es de lo más común. Tiene solución.", "Llegar al final ya es mucho. Solo falta variedad.", "Eso es más de lo que logra la mayoría."],
      lecturas: [
        "Todavía no tienes con qué llenar una canción. Con 3 movimientos bien unidos, eso cambia.",
        "Arrancas, pero te quedas en blanco. No es falta de talento: falta una secuencia clara.",
        "Llegas al final, aunque repitiendo. Sumar pocos movimientos te dará la variedad que buscas.",
        "Sostienes la canción con variedad, algo que a la mayoría le cuesta."
      ]},
    { area: "O", tema: "Con pareja",
      texto: "Imagina que por fin bailas con esa persona con la que te gustaría bailar. ¿Qué pasaría?",
      ayuda: "Si nunca has bailado en pareja, responde lo que imaginas.",
      respuestas: [
        "No sabría ni cómo tomarle la mano, y me daría miedo pisarla.",
        "Estaría tan pendiente de mis pies que no podría ni mirarla.",
        "Intentaría una vuelta, pero seguramente saldría brusca o no se entendería.",
        "Me sentiría cómodo guiando movimientos sencillos y prestando atención a la otra persona."
      ],
      eco: ["Es normal sentir eso. Llevar a alguien se aprende.", "Pasa muchísimo: la atención se va a los pies.", "Ya te animas a proponer, y eso dice mucho.", "Muy bien. Esa comodidad se nota al bailar."],
      lecturas: [
        "Bailar con alguien todavía te genera dudas. Es normal: llevar a otra persona se aprende con señales simples.",
        "Hoy tu atención se va a los pies. Cuando el paso salga solo, podrás estar presente con la otra persona.",
        "Ya intentas proponer. Falta que tus señales sean más suaves y claras.",
        "Te sientes cómodo guiando y prestas atención a la otra persona: una muy buena base."
      ]}
  ]
};
/* =================== FIN DE LA CONFIGURACIÓN =================== */

const $ = (id) => document.getElementById(id);
const Q = CONFIG.preguntas;
const ORDER = Object.keys(CONFIG.rutas);          // S, A, B, O, R
const MAX = Q.length * 3;
let answers = new Array(Q.length).fill(null);
let current = 0;
let advanceTimer = null;
let motivo = null;           // índice de CONFIG.motivo.opciones
let result = null;
const pad = (n) => String(n).padStart(2, "0");

/* Portada */
$("brand").innerHTML = `${CONFIG.marca.nombre} <b>${CONFIG.marca.destacado}</b>`;
$("coverEyebrow").textContent = CONFIG.portada.eyebrow;
$("coverTitle").innerHTML = CONFIG.portada.titulo;
$("coverIntro").textContent = CONFIG.portada.intro;
$("coverPromise").textContent = CONFIG.portada.promesa;
$("coverPromise").hidden = !CONFIG.portada.promesa;
$("coverMeta").textContent = CONFIG.portada.meta;
$("startBtn").textContent = CONFIG.portada.boton;
$("coverLearn").innerHTML = CONFIG.portada.aprenderas
  .map((t, i) => `<li><i>${pad(i + 1)}</i><span>${t}</span></li>`).join("");
$("coverLearn").hidden = !CONFIG.portada.aprenderas.length;
$("qTotal").textContent = Q.length;
$("progress").innerHTML = Q.map(() => `<span class="beat"></span>`).join("");

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  const el = $(id);
  el.classList.remove("fade"); void el.offsetWidth; el.classList.add("fade");
  window.scrollTo({ top: 0 });
}

function renderQuestion(){
  const q = Q[current];
  $("qNum").textContent = current + 1;
  $("qBig").textContent = pad(current + 1);
  $("qPct").textContent = Math.round(current / Q.length * 100) + "%";
  [...$("progress").children].forEach((b, i) => {
    b.className = "beat" + (i < current ? " done" : i === current ? " now" : "");
  });
  $("qText").textContent = q.texto;
  $("qHint").textContent = q.ayuda || "";
  $("qHint").hidden = !q.ayuda;
  $("opts").innerHTML = q.respuestas.map((r, i) => `
    <button type="button" class="opt" role="radio" data-i="${i}" aria-checked="${answers[current] === i}">
      <span class="dot" aria-hidden="true"></span><span>${r}<span class="opt-eco" aria-hidden="true">${answers[current] === i && q.eco ? q.eco[i] : ""}</span></span>
    </button>`).join("");
  $("qEco").textContent = answers[current] !== null && q.eco ? q.eco[answers[current]] : "";
  $("prevBtn").textContent = current === 0 ? "Volver" : "Anterior";
  $("nextBtn").textContent = "Siguiente";
  $("nextBtn").disabled = answers[current] === null;
  const body = $("qBody");
  body.classList.remove("fade"); void body.offsetWidth; body.classList.add("fade");
}

$("opts").addEventListener("click", (e) => {
  const opt = e.target.closest(".opt"); if (!opt) return;
  answers[current] = +opt.dataset.i;
  $("opts").querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", o === opt));
  $("nextBtn").disabled = false;
  clearTimeout(advanceTimer);
  const eco = Q[current].eco ? Q[current].eco[answers[current]] : "";
  $("qEco").textContent = eco;
  $("opts").querySelectorAll(".opt-eco").forEach(el => el.textContent = el.closest(".opt") === opt ? eco : "");
  advanceTimer = setTimeout(goNext, eco ? 1500 : 380);   // avanza solo, dando tiempo a leer la reacción
});

function goNext(){
  clearTimeout(advanceTimer);
  if (answers[current] === null) return;
  if (current < Q.length - 1){ current++; renderQuestion(); }
  else finish();
}
function goPrev(){
  clearTimeout(advanceTimer);
  if (current === 0){ show("s-cover"); return; }
  current--; renderQuestion();
}
$("nextBtn").addEventListener("click", goNext);
$("prevBtn").addEventListener("click", goPrev);
$("startBtn").addEventListener("click", () => { current = 0; show("s-quiz"); renderQuestion(); });

/* Cálculo del resultado */
function compute(){
  const byArea = {};
  ORDER.forEach(k => byArea[k] = { sum: 0, n: 0 });
  Q.forEach((q, i) => { byArea[q.area].sum += answers[i]; byArea[q.area].n++; });
  const pct = (k) => byArea[k].n ? byArea[k].sum / (byArea[k].n * 3) : 1;
  const total = answers.reduce((a, b) => a + b, 0);
  const lowest = ORDER.reduce((best, k) => pct(k) < pct(best) ? k : best, ORDER[0]);
  const allTop = pct(lowest) >= 1;
  const etapaIdx = CONFIG.etapas.reduce((acc, s, i) => total >= s.desde ? i : acc, 0);
  return { pct, total, key: allTop ? null : lowest, ruta: allTop ? CONFIG.rutaSoltura : CONFIG.rutas[lowest],
           etapaIdx, etapa: CONFIG.etapas[etapaIdx] };
}

/* Pregunta final (motivo) */
const M = CONFIG.motivo;
$("mEyebrow").textContent = M.eyebrow;
$("mText").textContent = M.texto;
$("mHint").textContent = M.ayuda;
$("mOpts").innerHTML = M.opciones.map((o, i) => `
  <button type="button" class="opt" role="radio" data-i="${i}" aria-checked="false">
    <span class="dot" aria-hidden="true"></span><span>${o.texto}</span>
  </button>`).join("");
$("mOpts").addEventListener("click", (e) => {
  const opt = e.target.closest(".opt"); if (!opt) return;
  motivo = +opt.dataset.i;
  $("mOpts").querySelectorAll(".opt").forEach(o => o.setAttribute("aria-checked", o === opt));
  $("mNext").disabled = false;
});
$("mPrev").addEventListener("click", () => { show("s-quiz"); renderQuestion(); });
$("mNext").addEventListener("click", () => { if (motivo !== null) showThinking(); });

function finish(){
  $("mOpts").querySelectorAll(".opt").forEach((o, i) => o.setAttribute("aria-checked", i === motivo));
  $("mNext").disabled = motivo === null;
  show("s-motive");
}

function showThinking(){
  show("s-thinking");
  const steps = CONFIG.carga, wait = 750;
  steps.forEach((t, i) => setTimeout(() => $("thinkText").textContent = t, i * wait));
  setTimeout(renderResult, steps.length * wait + 150);
}

// Lecturas de las respuestas que pertenecen a un área
const readings = (k) => Q.map((q, i) => q.area === k && q.lecturas ? q.lecturas[answers[i]] : null).filter(Boolean);

function renderResult(){
  result = compute();
  const { ruta, etapa, etapaIdx, total, key, pct } = result;
  const R = CONFIG.resultado;

  $("printDate").textContent = `${CONFIG.marca.nombre} ${CONFIG.marca.destacado} · Diagnóstico · ` +
    new Date().toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" });

  // [A] Punto de partida
  $("rHead").textContent = R.titulo;
  $("rStageLine").textContent = `${R.etapaPrefijo} ${etapa.nombre}`;
  $("rScore").textContent = `· ${total}/${MAX}`;
  $("rTrack").innerHTML = CONFIG.etapas.map((_, i) =>
    `<span class="${i < etapaIdx ? "on" : i === etapaIdx ? "here" : ""}"></span>`).join("");
  $("rPrioLabel").textContent = R.prioridadEtiqueta;
  $("rRoute").textContent = ruta.ruta;
  $("rPrio").textContent = ruta.prioridad;

  // [B] Primera acción (según ruta y nivel de respuesta)
  const qKey = key ? Q.findIndex(q => q.area === key) : -1;
  const lvl = qKey >= 0 ? answers[qKey] : 0;
  const moves = Array.isArray(ruta.movimientos) ? ruta.movimientos : (ruta.movimientos[lvl] || ruta.movimientos[0]);
  const moveHTML = (m, full) => typeof m === "string" ? `<p class="mc">${m}</p>` :
    `<p class="mt">${m.t}</p><p class="mc">${m.c}</p>` +
    (full && m.p ? `<p class="mp"><b>Por qué funciona:</b> ${m.p}</p>` : "") +
    `<p class="ms"><b>${R.observar}</b>Vas bien cuando ${m.s}</p>`;
  $("rFirstLabel").textContent = R.primeraAccion;
  $("rFirst").innerHTML = moveHTML(moves[0], false);
  $("rMoreSummary").textContent = R.verMas;
  $("rMore").open = false;
  $("rMoves").innerHTML = moves.slice(1).map((m, i) =>
    `<li><span class="num">${pad(i + 2)}</span><div>${moveHTML(m, true)}</div></li>`).join("");
  $("rMovesNote").textContent = CONFIG.notaPasos;
  $("rProfile").innerHTML = ORDER.map(k => {
    const a = CONFIG.rutas[k];
    return `<li class="${k === key ? "key" : ""}">
      <span class="l">${k}</span>
      <div><div class="n"><span>${a.area} · ${a.etiqueta}</span><span>${k === key ? "Tu prioridad" : ""}</span></div>
      <div class="bar"><i data-w="${Math.max(6, Math.round(pct(k) * 100))}"></i></div></div></li>`;
  }).join("");
  setBars();

  // [C] Testimonio (solo con material real y autorizado) + presentación
  renderTestimonio();
  $("juanName").textContent = CONFIG.juan.titulo;
  $("juanText").textContent = CONFIG.juan.texto;

  // [D] CTA único
  const mot = motivo !== null ? M.opciones[motivo] : null;
  $("nextTitle").textContent = mot ? mot.cta : CONFIG.cta.tituloNeutro;
  $("nextBody").innerHTML = CONFIG.cta.parrafos.map(p => `<p>${p}</p>`).join("");
  $("ctaNote").textContent = CONFIG.cta.nota;
  $("printNext").textContent = CONFIG.cta.pdf;
  updateCta();
  show("s-result");
}

function renderTestimonio(){
  const T = CONFIG.testimonio, ok = T.autorizado && T.video;
  $("testiBlock").hidden = !ok;
  const v = $("testiVideo");
  if (!ok){ v.removeAttribute("src"); v.innerHTML = ""; return; }
  $("testiTitle").textContent = T.titulo;
  v.src = T.video;
  if (T.miniatura) v.poster = T.miniatura;
  v.innerHTML = T.subtitulos ? `<track kind="captions" srclang="es" label="Español" src="${T.subtitulos}" default>` : "";
  $("testiQuote").textContent = T.cita ? `«${T.cita}»` : ""; $("testiQuote").hidden = !T.cita;
  $("testiFrase").textContent = T.frase || ""; $("testiFrase").hidden = !T.frase;
  $("testiName").textContent = T.nombre || ""; $("testiName").hidden = !T.nombre;
  $("testiDetail").textContent = T.detalle || ""; $("testiDetail").hidden = !T.detalle;
}

// Barras del mapa SABOR (se animan cuando están visibles)
function setBars(){
  requestAnimationFrame(() => requestAnimationFrame(() =>
    $("rProfile").querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%")));
}
$("rMore").addEventListener("toggle", () => { if ($("rMore").open) setBars(); });

function updateCta(){
  const { ruta, etapa } = result;
  const msg = CONFIG.mensaje({
    etapa: etapa.nombre,
    ruta: ruta.ruta,
    motivo: motivo !== null ? M.opciones[motivo].corto : "Aprender a bailar salsa",
    respuestas: Q.map((q, i) => ({ tema: q.tema, respuesta: q.respuestas[answers[i]] }))
  });
  const main = $("ctaMain");
  main.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  main.textContent = CONFIG.cta.boton;
}

// Guardar: el PDF incluye las recomendaciones aunque el desplegable esté cerrado
let moreWasOpen = false;
window.addEventListener("beforeprint", () => { moreWasOpen = $("rMore").open; $("rMore").open = true; });
window.addEventListener("afterprint", () => { $("rMore").open = moreWasOpen; });
$("saveBtn").addEventListener("click", () => window.print());
$("restartBtn").addEventListener("click", () => {
  clearTimeout(advanceTimer);
  answers = new Array(Q.length).fill(null); current = 0; motivo = null; result = null;
  $("rMore").open = false;
  ["rFirst", "rMoves", "rProfile"].forEach(id => $(id).innerHTML = "");
  show("s-cover");
});

/* Teclado: 1–4 elige respuesta, flechas navegan */
document.addEventListener("keydown", (e) => {
  if ($("s-quiz").hidden) return;
  if (e.key >= "1" && e.key <= "4"){ const o = $("opts").children[+e.key - 1]; if (o) o.click(); }
  else if (e.key === "ArrowRight"){ if (!$("nextBtn").disabled) goNext(); }
  else if (e.key === "ArrowLeft") goPrev();
});
</script>
</body>
</html>
